<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | US Pizza</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                🍕
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to your US Pizza account
            </p>

            <form id="loginForm">
            <div class="auth-message" id="authMessage"></div>
                <div class="auth-field">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Login
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>


            <a
                href="index.html"
                class="back-home-link"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
