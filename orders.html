<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders | US Pizza</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="nav-container">

            <a
                href="index.html"
                class="logo"
            >
                <span class="logo-mark">🍕</span>

                <span>
                    US <strong>PIZZA</strong>
                </span>
            </a>


            <a
                href="index.html"
                class="login-btn"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Back Home
            </a>

        </div>

    </header>


    <!-- ORDERS -->

    <main class="orders-page">

        <div class="orders-container">

            <div class="orders-heading">

                <span class="section-label">
                    <i class="fa-solid fa-box"></i>
                    ACCOUNT
                </span>

                <h1>My Orders</h1>

                <p>
                    View your previous US Pizza orders.
                </p>

            </div>


            <div
                class="orders-list"
                id="ordersList"
            >

                <!-- Orders will appear here -->

            </div>

        </div>

    </main>


    <script src="js/orders.js"></script>

</body>

</html>
