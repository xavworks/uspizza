<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | US Pizza</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                🍕
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join US Pizza today
            </p>


            <form id="registerForm">

                <div class="auth-field">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="registerConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="registerConfirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a
                href="index.html"
                class="back-home-link"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
